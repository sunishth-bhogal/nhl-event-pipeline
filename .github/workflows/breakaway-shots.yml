# TEMPORARY review helper: renders the replay page and pushes screenshots to
# the breakaway-shots branch. Safe to delete.
name: breakaway-shots
on:
  push:
    branches: [breakaway]
    paths: [breakaway/web/**, breakaway/tests/shots.mjs, breakaway/engine/src/**]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock --prefix /tmp/pw playwright@1.48.2 && /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - run: cargo build --release --bin server
        working-directory: breakaway/engine
      - continue-on-error: true
        run: |
          (cd breakaway/engine && ./target/release/server --port 8123 --speed 30 --data /tmp/bk > /tmp/server.log 2>&1 &)
          sleep 2
          NODE_PATH=/tmp/pw/node_modules node breakaway/tests/shots.mjs
          cp /tmp/server.log shots/server.log || true
      - if: always()
        run: |
          mkdir -p shots && cd shots
          git init -q -b breakaway-shots
          git config user.name "shots-bot" && git config user.email "shots-bot@users.noreply.github.com"
          git add -A && git commit -q -m "shots for ${GITHUB_SHA}" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" breakaway-shots
